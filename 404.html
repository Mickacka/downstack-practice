<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect</title>
    <link rel="icon" href="/downstack-practice/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/downstack-practice/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/downstack-practice/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2a2c30">
</head>
<body>
    <h1 id="content"></h1>
    <script>
        var halfpath = '/downstack-practice/usermode.html/'
        var fullpath = window.location.origin + '/downstack-practice/usermode.html'
        var name = window.location.pathname
        var temp = ''

        if (name.startsWith(halfpath)){
        name = name.slice(halfpath.length)
        var temp = name.slice(0,name.length - (name.endsWith('/')))
        }
        
        
        if (temp != ''){
        sessionStorage.setItem('temp', temp)
        document.getElementById("content").innerHTML = 'Redirecting'
        window.location.href = fullpath
        }
        else{
        document.getElementById("content").innerHTML = 'Invalid path'
        }
    </script>
</body>
</html>
